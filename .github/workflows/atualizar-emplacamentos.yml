# Verifica todo dia se a Fenabrave publicou um mês novo. Só grava e republica o site quando há novidade.
name: Atualizar emplacamentos

on:
  schedule:
    - cron: '17 10 * * *' # 7h17 em Brasília
  workflow_dispatch:
    inputs:
      simular:
        description: Baixa e processa tudo, sem gravar no repositório
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency: atualizar-emplacamentos

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar leitor de PDF
        run: python -m pip install --quiet pypdf

      - name: Gerar a base
        env:
          SIMULAR: ${{ inputs.simular }}
        run: |
          if [ "$SIMULAR" = "true" ]; then
            node ferramentas/atualizar-emplacamentos.mjs --forcar
            git diff --stat -- emplacamentos/dados.json
          else
            node ferramentas/atualizar-emplacamentos.mjs
          fi

      - name: Gravar e republicar
        if: ${{ inputs.simular != true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- emplacamentos/dados.json; then
            echo "Sem mês novo."
            exit 0
          fi
          ref=$(node -p "require('./emplacamentos/dados.json').referencia")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emplacamentos/dados.json
          git commit -m "Atualiza emplacamentos até $ref"
          git push
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            || echo "::warning::Não foi possível pedir a republicação do site."
